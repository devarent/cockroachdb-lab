services:
  cockroach:
    image: cockroachdb/cockroach:v25.4.21
    container_name: cockroach-lab
    restart: unless-stopped
    command: start-single-node --insecure
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data

volumes:
  cockroach-data:
